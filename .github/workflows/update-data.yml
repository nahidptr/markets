name: Update price data

on:
  schedule:
    - cron: "17 6 3 * *"   # 06:17 UTC on the 3rd of every month
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/update_data.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/prices.json; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git commit -m "Update price data ($(date -u +%Y-%m))"
          git push
